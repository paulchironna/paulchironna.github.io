<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 242" width="360" height="242" role="img"
     aria-label="High-pass filter: square wave input through a series capacitor and shunt resistor, with output waveforms at low, medium and high frequencies">
  <style>
