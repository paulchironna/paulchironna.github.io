  <line x1="12" y1="100" x2="140" y2="100" stroke="#123645" stroke-width="1" stroke-dasharray="2 3"/>
  <polyline points="12,100 12,85 28,85 28,115 44,115 44,85 60,85 60,115 76,115 76,85 92,85 92,115 108,115 108,85 124,85 124,115 140,115 140,100" fill="none" stroke="#22e1ff" stroke-width="2"
            stroke-linejoin="round" stroke-linecap="round"/>

