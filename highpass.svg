  <!-- current direction arrow -->
  <line x1="150" y1="21" x2="186" y2="21" stroke="#22e1ff" stroke-width="2"/>
  <polygon points="186,21 179,17.5 179,24.5" fill="#22e1ff"/>

  <!-- top rail, broken by the capacitor -->
  <line x1="152" y1="47" x2="196" y2="47" stroke="#22e1ff" stroke-width="2"/>
  <line x1="216" y1="47" x2="330" y2="47" stroke="#22e1ff" stroke-width="2"/>
