  <line x1="199" y1="34" x2="199" y2="60" stroke="#22e1ff" stroke-width="3"/>
  <line x1="212" y1="34" x2="212" y2="60" stroke="#22e1ff" stroke-width="3"/>
  <text x="205.5" y="28" class="part" text-anchor="middle">C</text>

  <!-- bottom rail -->
  <line x1="152" y1="128" x2="330" y2="128" stroke="#22e1ff" stroke-width="2"/>

  <!-- shunt resistor -->
  <line x1="262" y1="47" x2="262" y2="62" stroke="#22e1ff" stroke-width="2"/>
  <polyline points="262,62 271,67 253,75 271,83 253,91 271,99 262,104"
